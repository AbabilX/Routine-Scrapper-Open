name: Android release

on:
  push:
    branches: [main]

concurrency:
  group: android-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Split ABI APKs
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write dart-define env
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_PATH_ROUTINE_VERSION: ${{ secrets.API_PATH_ROUTINE_VERSION }}
          API_PATH_AUTOCOMPLETE: ${{ secrets.API_PATH_AUTOCOMPLETE }}
          API_PATH_SCHEDULE: ${{ secrets.API_PATH_SCHEDULE }}
          API_PATH_FREE_ROOMS: ${{ secrets.API_PATH_FREE_ROOMS }}
          API_PATH_ROOMS_STATIC: ${{ secrets.API_PATH_ROOMS_STATIC }}
          API_PATH_TEACHERS_STATIC: ${{ secrets.API_PATH_TEACHERS_STATIC }}
        run: |
          set -euo pipefail
          missing=0
          for key in \
            API_BASE_URL \
            API_PATH_ROUTINE_VERSION \
            API_PATH_AUTOCOMPLETE \
            API_PATH_SCHEDULE \
            API_PATH_FREE_ROOMS \
            API_PATH_ROOMS_STATIC \
            API_PATH_TEACHERS_STATIC
          do
            if [ -z "${!key}" ]; then
              echo "::error::Add repository secret ${key} (Settings → Secrets and variables → Actions)."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          {
            printf 'API_BASE_URL=%s\n' "$API_BASE_URL"
            printf 'API_PATH_ROUTINE_VERSION=%s\n' "$API_PATH_ROUTINE_VERSION"
            printf 'API_PATH_AUTOCOMPLETE=%s\n' "$API_PATH_AUTOCOMPLETE"
            printf 'API_PATH_SCHEDULE=%s\n' "$API_PATH_SCHEDULE"
            printf 'API_PATH_FREE_ROOMS=%s\n' "$API_PATH_FREE_ROOMS"
            printf 'API_PATH_ROOMS_STATIC=%s\n' "$API_PATH_ROOMS_STATIC"
            printf 'API_PATH_TEACHERS_STATIC=%s\n' "$API_PATH_TEACHERS_STATIC"
          } > .env

      - name: Bump pubspec version
        id: bump
        run: bash .github/scripts/bump-pubspec-version.sh "${{ github.run_number }}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build split-per-ABI APKs
        run: >
          flutter build apk --release --split-per-abi
          --build-name="${{ steps.bump.outputs.name }}"
          --build-number="${{ steps.bump.outputs.code }}"
          --dart-define-from-file=.env

      - name: Package APKs
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.version }}"
          FILE_TAG="${VERSION//+/-}"
          mkdir -p dist
          shopt -s nullglob
          found=0
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$apk" | sed -E 's/app-(.+)-release\.apk/\1/')
            dest="dist/diu-${FILE_TAG}-${abi}.apk"
            cp "$apk" "$dest"
            echo "Packed $dest"
            found=1
          done
          if [ "$found" -ne 1 ]; then
            echo "::error::No split-per-ABI APKs under build/app/outputs/flutter-apk/"
            ls -la build/app/outputs/flutter-apk/ || true
            exit 1
          fi

      - name: Push version bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          if git diff --cached --quiet; then
            echo "Version already up to date"
            exit 0
          fi
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}"
          git push

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.name }}
          name: v${{ steps.bump.outputs.name }}
          generate_release_notes: true
          make_latest: true
          files: dist/*.apk
          body: |
            Android `${{ steps.bump.outputs.version }}` from `${{ github.sha }}`.

            - Most phones: `*-arm64-v8a.apk`
            - Older 32-bit phones: `*-armeabi-v7a.apk`
            - x86 emulator: `*-x86_64.apk`
